name: Cross-platform checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML jsonschema referencing
      - run: python -B tools/package_plugins.py --check
      - run: python -B -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/*.test.cjs
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm run build:viewer
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm test
        working-directory: site
